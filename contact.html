<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Gilbert B Hammer Photography</title>
<meta name="description" content="Get in touch about prints, commissions, or a specific gallery.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23151210'/%3E%3Cpath d='M5 9h2.7L9 6.6h6L16.3 9H19a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z' stroke='%23e0a458' stroke-width='1.4' fill='none'/%3E%3Ccircle cx='12' cy='14' r='3.3' stroke='%23e0a458' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav">
  <a href="index.html" class="brand">
    <span class="brand-name">Gilbert B Hammer</span>
    <span class="brand-sub">Photography</span>
  </a>
  <nav class="nav-links">
    <a href="commercial.html">Commercial</a>
    <a href="equine.html">Equine</a>
    <a href="client-projects.html">Client Projects</a>
    <a href="personal-projects.html">Personal Projects</a>
    <a href="editorial.html">Editorial</a>
    <a href="contact.html" class="nav-cta nav-cta-active">Contact</a>
  </nav>
</header>

<section class="contact-hero">
  <div class="contact-hero-copy">
    <div class="eyebrow">Prints &amp; Commissions</div>
    <h1>Get in touch.</h1>
    <p>Let&rsquo;s work together.</p>
  </div>
  <div class="photo contact-photo">
    <img src="uploads/contact-1.jpg" alt="Gilbert Hammer photographing with a telephoto lens" loading="lazy">
  </div>
</section>

<section class="contact-body">
  <form class="contact-form" id="contact-form">
    <label>
      Name
      <input type="text" name="name" placeholder="Your name" required>
    </label>
    <label>
      Email
      <input type="email" name="email" placeholder="you@example.com" required>
    </label>
    <label>
      Tell me more about your project or commissioned work.
      <textarea name="message" rows="5" placeholder="e.g. a print from the Equine gallery, or a commission for an event" required></textarea>
    </label>
    <button type="submit" class="cta-button contact-submit">Send request</button>
    <p class="form-status" id="form-status" role="status"></p>
  </form>

  <aside class="contact-info">
    <div class="contact-info-block">
      <div class="eyebrow small">Service Area</div>
      <p>World-wide</p>
    </div>
    <div class="contact-info-block">
      <div class="eyebrow small">Email</div>
      <p><a href="mailto:gilbert@hammermediagroup.com">gilbert@hammermediagroup.com</a></p>
    </div>
  </aside>
</section>

<footer class="site-footer">
  <div class="footer-copy">&copy; 2026 Gilbert B Hammer &mdash; Photography</div>
  <div class="footer-links">
    <a href="#" aria-label="Instagram">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor"/></svg>
    </a>
    <a href="#" aria-label="LinkedIn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/><line x1="7.5" y1="10" x2="7.5" y2="17" stroke="currentColor" stroke-width="1.5"/><circle cx="7.5" cy="7" r="1" fill="currentColor"/><path d="M11.5 17v-4.2c0-1.6 1-2.6 2.4-2.6s2.1 1 2.1 2.6V17" stroke="currentColor" stroke-width="1.5"/></svg>
    </a>
    <span class="divider"></span>
    <a href="https://hammermediagroup.com" class="footer-hmg">
      Part of Hammer Media Group
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</footer>

<script>
(function () {
  const form = document.getElementById('contact-form');
  const status = document.getElementById('form-status');
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const button = form.querySelector('button[type="submit"]');
    const data = Object.fromEntries(new FormData(form).entries());
    button.disabled = true;
    button.textContent = 'Sending…';
    status.textContent = '';
    status.className = 'form-status';
    try {
      const res = await fetch('/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error('request failed');
      form.reset();
      status.textContent = 'Thanks — your message is on its way.';
      status.className = 'form-status form-status-ok';
    } catch (err) {
      status.textContent = 'Something went wrong sending that. Try again, or email directly.';
      status.className = 'form-status form-status-error';
    } finally {
      button.disabled = false;
      button.textContent = 'Send request';
    }
  });
})();
</script>

</body>
</html>
